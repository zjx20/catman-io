# 「小貓人」（siu2 maau1 jan4）粤语唤醒词训练配置。
# 所有键的默认值和含义见 training/wakeword/config.py。
model_name: siu_maau_jan
wake_phrase: 小貓人
workdir: training/wakeword/work/siu_maau_jan

tts:
  voices: [zh-HK-HiuGaaiNeural, zh-HK-HiuMaanNeural, zh-HK-WanLungNeural]
  # 正样本语速只到 ±20%（v0 的档位）。v1 / v2 把语速加到 +100% 想覆盖真人快说，结果真人录音上召回反而从 0.71
  # 掉到 0.58：+30% 以上的 TTS 片段像压缩过的合成音而不像人快说，还把正常语速的正样本稀释了一半；
  # 加上真人录音之后差距更明显（四折交叉验证：±20% 档 1.00，+100% 档 0.88～0.90）。快语速靠真人录音本身。
  rates: ["-20%", "-10%", "+0%", "+10%", "+20%"]
  pitches: ["-30Hz", "-15Hz", "+0Hz", "+15Hz", "+30Hz"]
  negative_rates: ["-10%", "+0%", "+15%"]
  negative_pitches: ["+0Hz"]
  other_language_voices:
    zh-CN: [zh-CN-XiaoxiaoNeural, zh-CN-YunxiNeural]
    en-US: [en-US-AriaNeural, en-US-GuyNeural]
  concurrency: 4

data:
  # 留空 = 用 training/wakeword/phrases.py 里的默认清单
  positive_phrases: []
  adversarial_phrases: []
  general_phrases: []
  # 真人录音（webdemo 存的 3 秒片段，按说话人分子目录）。没有真人录音时各版本在真人录音上召回只有 0.6～0.7，
  # 加 23 条进训练、留 8 条验证后折外召回 1.0——这是目前最有效的一步，多录几个人、几种距离和语气更好。
  extra_positive_dirs: [training/wakeword/real/siu_maau_jan/positive]
  extra_positive_val_dirs: [training/wakeword/real/siu_maau_jan/positive_val]
  extra_negative_dirs: []
  extra_negative_val_dirs: []
  # 真人录音相对合成片段的增强轮数倍率：3 时折外召回 0.97（最快那条 0.40 s 漏），8 时 1.00
  extra_positive_weight: 8
  val_fraction: 0.15
  # openWakeWord 预计算的通用负样本特征，按小时计下载（每小时约 15 MB）；0 = 不用。
  # 20 小时时模型会死记训练负样本（通用音频每小时误唤醒 38 次），100 小时降到 0.2 次以下
  precomputed_negative_hours: 100
  # 11 小时验证集特征（约 180 MB），用来估计每小时误唤醒次数并挑选检查点
  fp_validation: true

augment:
  clip_seconds: 2.0
  # 轻度重采样变速（同时变调）是唯一保留的后处理变速：留出整个 TTS 音色验证时它把召回从 0.69 提到 0.86，
  # 真人录音上也高 0.1。WSOLA 变速不变调（p_tempo）试过几种用法都拖低正常语速的召回，只留给 evaluate 做压力测试。
  speed_factors: [0.9, 1.0, 1.1]
  p_speed: 0.5
  tempo_range: [0.9, 1.5]
  p_tempo: 0.0
  # 变速后不短于 0.45 s（真人再快也说不到更短）
  min_seconds: 0.45
  rounds_positive: 8
  rounds_negative: 4
  # 推荐：用目标设备在真实环境录几段噪声（电视、厨房、街声）放进来
  background_dirs: []
  rir_dirs: []
  download_rirs: true

train:
  layer_size: 32
  n_blocks: 1
  dropout: 0.1
  steps: 30000
  batch_positive: 50
  batch_negative: 50
  batch_precomputed: 1024
  max_negative_weight: 1500
  target_fp_per_hour: 0.2
  seed: 0
  # 单线程：同一配方 4 线程那次训练通用音频误唤醒 0.65/h（没一个检查点达标），单线程 seed 0 是 0.19/h、seed 1 是 0.09/h，
  # 这个小模型的训练轨迹本身波动就很大，单线程至少可复现；4 核上大约 20 分钟
  threads: 1
