# v0 实际使用的训练配置（从模型元数据 config 段还原；当时仓库里的 YAML 已经改成 +30%/+40% 语速但没有重训）
model_name: siu_maau_jan
wake_phrase: 小貓人
workdir: training/wakeword/work/siu_maau_jan
tts:
  voices:
  - zh-HK-HiuGaaiNeural
  - zh-HK-HiuMaanNeural
  - zh-HK-WanLungNeural
  rates:
  - -20%
  - -10%
  - +0%
  - +10%
  - +20%
  pitches:
  - -30Hz
  - -15Hz
  - +0Hz
  - +15Hz
  - +30Hz
  negative_rates:
  - -10%
  - +0%
  - +15%
  negative_pitches:
  - +0Hz
  other_language_voices:
    zh-CN:
    - zh-CN-XiaoxiaoNeural
    - zh-CN-YunxiNeural
    en-US:
    - en-US-AriaNeural
    - en-US-GuyNeural
  concurrency: 6
  retries: 5
  trim_db: -45.0
  max_positive_clips: 0
  max_negative_clips: 0
data:
  positive_phrases: []
  adversarial_phrases: []
  general_phrases: []
  mandarin_phrases: []
  english_phrases: []
  extra_positive_dirs: []
  extra_negative_dirs: []
  val_fraction: 0.15
  precomputed_negative_hours: 100
  fp_validation: true
augment:
  clip_seconds: 2.0
  rounds_positive: 8
  rounds_negative: 4
  background_dirs: []
  rir_dirs: []
  download_rirs: true
  speed_factors:
  - 0.9
  - 1.0
  - 1.1
  p_speed: 0.5
  snr_db:
  - -5.0
  - 20.0
  p_background: 0.75
  p_colored_noise: 0.3
  colored_snr_db:
  - 5.0
  - 30.0
  p_babble: 0.2
  babble_snr_db:
  - 0.0
  - 15.0
  p_rir: 0.5
  p_bandstop: 0.2
  p_lowpass: 0.15
  p_distortion: 0.15
  peak_range:
  - 0.05
  - 1.0
  end_jitter: 0.2
  batch_size: 64
train:
  layer_size: 32
  n_blocks: 1
  dropout: 0.1
  steps: 30000
  batch_positive: 50
  batch_negative: 50
  batch_precomputed: 1024
  lr: 0.0001
  max_negative_weight: 1500.0
  target_fp_per_hour: 0.2
  seed: 0
  threads: 0
