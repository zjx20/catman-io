name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,train,asr,tts,demo]"
      - name: Lint
        run: ruff check catman_io training tests
      - name: Download openWakeWord base models
        run: catman-io setup
      - name: Fetch the wake-word model (models/wakeword/<version> branch)
        run: python scripts/wakeword_model.py pull
      - name: Test
        run: pytest -q
